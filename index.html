<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily work log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Apply saved or system theme before paint to avoid a flash
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --field: #f5f6fa;
    --ink: #151826;
    --muted: #6b7185;
    --line: #e1e4ee;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-ink: #ffffff;
    --ok: #12805c;
    --err: #c2391f;
    --shadow: 0 1px 2px rgba(20,24,50,.06), 0 12px 32px rgba(20,24,50,.08);
  }
  :root[data-theme="dark"] {
    --bg: #0d1017;
    --card: #151a24;
    --field: #0d1017;
    --ink: #eceef6;
    --muted: #8d95ab;
    --line: #262d3c;
    --accent: #8c9cff;
    --accent-hover: #a6b3ff;
    --accent-ink: #0d1017;
    --ok: #4fd1a1;
    --err: #ff8f78;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    transition: background .25s ease, color .25s ease;
  }
  [hidden] { display: none !important; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }
  .content { flex: 1; min-width: 0; padding: 72px 16px 32px; }
  .panel { width: 100%; max-width: 580px; margin: 0 auto; }
  .panel.wide { max-width: 960px; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    flex: none;
    width: 232px;
    height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 16px 12px;
    background: var(--card);
    border-right: 1px solid var(--line);
    transition: width .2s ease, transform .25s ease, background .25s ease, border-color .25s ease;
    z-index: 40;
  }
  .sb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding-left: 8px; }
  .brand { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; white-space: nowrap; }
  .icon-btn {
    width: 40px; height: 40px; flex: none;
    display: grid; place-items: center; padding: 0;
    color: var(--muted); background: transparent;
    border: 0; border-radius: 10px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: var(--field); color: var(--ink); }
  .icon-btn svg { width: 20px; height: 20px; transition: transform .2s ease; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 11px 12px;
    font: inherit; font-weight: 600; text-align: left;
    color: var(--muted); background: transparent;
    border: 0; border-radius: 12px; cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .nav-item svg { width: 20px; height: 20px; flex: none; }
  .nav-item:hover { background: var(--field); color: var(--ink); }
  .nav-item[aria-current="page"] {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }

  .backdrop {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  /* Floating buttons */
  .float-btn {
    position: fixed; top: 16px;
    width: 44px; height: 44px;
    display: grid; place-items: center; padding: 0;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 50%;
    box-shadow: var(--shadow); cursor: pointer;
    z-index: 20;
    transition: background .25s ease, border-color .25s ease, transform .15s ease;
  }
  .float-btn:hover { transform: scale(1.06); }
  .float-btn svg { width: 20px; height: 20px; }
  .theme-toggle { right: 16px; z-index: 60; }
  .menu-btn { left: 16px; display: none; }
  .theme-toggle .moon { display: none; }
  :root[data-theme="light"] .theme-toggle .sun { display: none; }
  :root[data-theme="light"] .theme-toggle .moon { display: block; }

  /* Desktop: collapsible rail */
  @media (min-width: 800px) {
    .app.collapsed .sidebar { width: 72px; }
    .app.collapsed .label { display: none; }
    .app.collapsed .sb-head { justify-content: center; padding-left: 0; }
    .app.collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
    .app.collapsed .sb-collapse svg { transform: rotate(180deg); }
    .backdrop { display: none; }
  }
  /* Mobile: slide-over drawer */
  @media (max-width: 799px) {
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 260px; height: auto;
      transform: translateX(-100%);
      box-shadow: var(--shadow);
    }
    .sidebar.open { transform: none; }
    .sb-collapse { display: none; }
    .menu-btn { display: grid; }
  }

  /* ---------- Cards & forms ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: var(--shadow);
    transition: background .25s ease, border-color .25s ease;
  }
  h1 { margin: 0 0 6px; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin: 0 0 28px; color: var(--muted); }

  .field { margin-bottom: 22px; }
  label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 600; }
  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    transition: border-color .15s ease, box-shadow .15s ease, background .25s ease;
  }
  input[type="date"] { min-height: 46px; }
  textarea { min-height: 200px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  input:disabled, textarea:disabled { opacity: .7; }

  .save {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    font: inherit; font-weight: 600;
    color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 12px; padding: 14px 22px; cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .save:hover:not(:disabled) { background: var(--accent-hover); }
  .save:active:not(:disabled) { transform: scale(.99); }
  .save:disabled { opacity: .75; cursor: wait; }
  button:focus-visible, .nav-item:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }
  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2.5px solid currentColor; border-right-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .loading > .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status { min-height: 1.5em; margin: 16px 0 0; text-align: center; font-weight: 500; font-size: .95rem; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  /* ---------- Sheet view ---------- */
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .sheet-head .sub { margin: 0; }
  .ghost {
    flex: none;
    display: inline-flex; align-items: center; gap: 8px;
    font: inherit; font-weight: 600; font-size: .9rem;
    color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; cursor: pointer;
    transition: border-color .15s ease;
  }
  .ghost:hover:not(:disabled) { border-color: var(--accent); }
  .ghost:disabled { opacity: .7; cursor: wait; }
  .ghost .spinner { width: 14px; height: 14px; border-width: 2px; }
  .table-wrap {
    max-height: 65vh;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  table { width: 100%; min-width: 480px; border-collapse: collapse; }
  th, td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--field); font-size: .8rem; font-weight: 600; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.sl { width: 64px; color: var(--muted); }
  td.date { white-space: nowrap; }
  td.work { min-width: 200px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #sheet-msg { margin: 0; padding: 28px 14px; text-align: center; color: var(--muted); }
  #sheet-msg.err { color: var(--err); }

  /* ---------- Passcode lock ---------- */
  .lock { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: var(--bg); }
  .lock .card { width: 100%; max-width: 400px; padding: 32px 28px; }
  .lock h1 { font-size: 1.5rem; }
  .lock .sub { margin-bottom: 22px; }
  #lock-err { min-height: 1.5em; margin: 14px 0 0; text-align: center; color: var(--err); font-weight: 500; font-size: .95rem; }
  .nav-spacer { margin-top: auto; }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .sheet-head { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .spinner { animation-duration: 1.5s; }
  }
</style>
</head>
<body>

<button type="button" class="float-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="sidebar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>

<button type="button" class="float-btn theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Toggle theme">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<div class="lock" id="lock">
  <div class="card">
    <h1>Enter passcode</h1>
    <p class="sub">This log is private. Enter your passcode to continue.</p>
    <form id="lock-form">
      <div class="field">
        <label for="passcode">Passcode</label>
        <input type="password" id="passcode" autocomplete="current-password" required>
      </div>
      <button type="submit" class="save" id="unlock">
        <span class="spinner" aria-hidden="true"></span>
        <span id="unlock-label">Unlock</span>
      </button>
      <p id="lock-err" role="alert"></p>
    </form>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sb-head">
      <span class="brand label">Work log</span>
      <button type="button" class="icon-btn sb-collapse" id="sb-collapse" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <nav class="nav">
      <button type="button" class="nav-item" data-view="entry" aria-current="page" title="Entry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span class="label">Entry</span>
      </button>
      <button type="button" class="nav-item" data-view="sheet" title="Sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>
        <span class="label">Sheet</span>
      </button>
    </nav>
    <button type="button" class="nav-item nav-spacer" id="lock-btn" title="Lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span class="label">Lock</span>
    </button>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="content">
    <!-- Entry view -->
    <section class="panel" id="view-entry">
      <div class="card">
        <h1>Daily work log</h1>
        <p class="sub">Add today's entry to your sheet.</p>

        <form id="log-form">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
          </div>
          <div class="field">
            <label for="work">Work done</label>
            <textarea id="work" name="work" required placeholder="What did you work on today?"></textarea>
          </div>
          <button type="submit" class="save" id="save">
            <span class="spinner" aria-hidden="true"></span>
            <span id="save-label">Save entry</span>
          </button>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- Sheet view (read-only) -->
    <section class="panel wide" id="view-sheet" hidden>
      <div class="card">
        <div class="sheet-head">
          <div>
            <h1>Sheet</h1>
            <p class="sub" id="sheet-meta">Newest entries first.</p>
          </div>
          <button type="button" class="ghost" id="refresh">
            <span class="spinner" aria-hidden="true"></span>
            <span id="refresh-label">Refresh</span>
          </button>
        </div>
        <div class="table-wrap" id="table-wrap" hidden>
          <table>
            <thead><tr><th>SL no</th><th>Date</th><th>Work done</th></tr></thead>
            <tbody id="sheet-body"></tbody>
          </table>
        </div>
        <p id="sheet-msg" role="status" aria-live="polite">Loading…</p>
      </div>
    </section>
  </div>
</div>

<script>
  // Paste your Apps Script Web app URL here (ends with /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP0WQoWg2lO0FxJ0uF4Uuc6BDNS6mnG8NzDaIAQxXsfMw3m7YuFlj2VdR7zNQeWeJw/exec";

  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const app = $("app");
  const sidebar = $("sidebar");
  const backdrop = $("backdrop");
  const isDesktop = () => window.matchMedia("(min-width: 800px)").matches;
  const urlMissing = () => SCRIPT_URL.startsWith("PASTE");

  /* ---------- Passcode (typed once per device, never stored in this file) ---------- */
  let passcode = "";
  try { passcode = localStorage.getItem("passcode") || ""; } catch (e) {}
  const lockEl = $("lock");
  if (passcode) lockEl.hidden = true;

  /* ---------- Theme toggle ---------- */
  const themeBtn = $("theme-toggle");
  function syncThemeLabel() {
    const dark = root.getAttribute("data-theme") === "dark";
    themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  syncThemeLabel();
  themeBtn.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    syncThemeLabel();
  });

  /* ---------- Sidebar ---------- */
  const collapseBtn = $("sb-collapse");
  function setCollapsed(on) {
    app.classList.toggle("collapsed", on);
    collapseBtn.setAttribute("aria-expanded", String(!on));
    collapseBtn.setAttribute("aria-label", on ? "Expand sidebar" : "Collapse sidebar");
    collapseBtn.title = on ? "Expand sidebar" : "Collapse sidebar";
    try { localStorage.setItem("sidebar-collapsed", on ? "1" : "0"); } catch (e) {}
  }
  try { if (localStorage.getItem("sidebar-collapsed") === "1") setCollapsed(true); } catch (e) {}
  collapseBtn.addEventListener("click", () => setCollapsed(!app.classList.contains("collapsed")));

  function setDrawer(open) {
    sidebar.classList.toggle("open", open);
    backdrop.classList.toggle("show", open);
    $("menu-btn").setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }
  $("menu-btn").addEventListener("click", () => setDrawer(!sidebar.classList.contains("open")));
  backdrop.addEventListener("click", () => setDrawer(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
  window.addEventListener("resize", () => { if (isDesktop()) setDrawer(false); });

  /* ---------- Views ---------- */
  let sheetLoaded = false;
  function showView(name) {
    $("view-entry").hidden = name !== "entry";
    $("view-sheet").hidden = name !== "sheet";
    document.querySelectorAll(".nav-item[data-view]").forEach(b => {
      if (b.dataset.view === name) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    if (!isDesktop()) setDrawer(false);
    if (name === "sheet" && !sheetLoaded) loadSheet();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".nav-item[data-view]").forEach(b =>
    b.addEventListener("click", () => showView(b.dataset.view))
  );

  /* ---------- Entry form ---------- */
  const form = $("log-form");
  const dateInput = $("date");
  const workInput = $("work");
  const saveBtn = $("save");
  const saveLabel = $("save-label");
  const statusEl = $("status");

  function today() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  dateInput.value = today();

  function show(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || "";
  }
  function setSaving(on) {
    saveBtn.disabled = on;
    saveBtn.classList.toggle("loading", on);
    workInput.disabled = on;
    dateInput.disabled = on;
    saveLabel.textContent = on ? "Saving…" : "Save entry";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (urlMissing()) {
      show("Add your Apps Script URL in the SCRIPT_URL line first.", "err");
      return;
    }
    setSaving(true);
    show("");
    let saved = false;
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Apps Script sends no CORS headers; the write still goes through
        body: new URLSearchParams({ date: dateInput.value, work: workInput.value.trim(), key: passcode })
      });
      saved = true;
      workInput.value = "";
      dateInput.value = today();
      show("Saved to your sheet.", "ok");
    } catch (err) {
      show("Couldn't save. Check your connection and the script URL.", "err");
    } finally {
      setSaving(false);
      if (saved) {
        workInput.focus();
        loadSheet(); // keep the Sheet view current
      }
    }
  });

  /* ---------- Sheet view (read-only) ---------- */
  const refreshBtn = $("refresh");
  const tableWrap = $("table-wrap");
  const sheetBody = $("sheet-body");
  const sheetMsg = $("sheet-msg");
  const sheetMeta = $("sheet-meta");
  let loading = false;

  function setSheetMsg(text, isErr) {
    sheetMsg.textContent = text;
    sheetMsg.className = isErr ? "err" : "";
    sheetMsg.hidden = !text;
  }

  function renderRows(list) {
    sheetBody.textContent = "";
    const rows = list.slice().reverse(); // newest first
    rows.forEach(r => {
      const tr = document.createElement("tr");
      [["sl", r[0]], ["date", r[1]], ["work", r[2]]].forEach(([cls, val]) => {
        const td = document.createElement("td");
        td.className = cls;
        td.textContent = val; // textContent keeps entries safe and read-only
        tr.appendChild(td);
      });
      sheetBody.appendChild(tr);
    });
    sheetLoaded = true;
    tableWrap.hidden = rows.length === 0;
    setSheetMsg(rows.length === 0 ? "No entries yet." : "");
    const time = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    sheetMeta.textContent = rows.length + (rows.length === 1 ? " entry" : " entries") + ", newest first. Updated " + time + ".";
  }

  async function fetchRows(key) {
    const res = await fetch(SCRIPT_URL + "?key=" + encodeURIComponent(key) + "&t=" + Date.now());
    return res.json();
  }

  async function loadSheet() {
    if (loading) return;
    if (urlMissing()) {
      tableWrap.hidden = true;
      setSheetMsg("Add your Apps Script URL in the SCRIPT_URL line first.", true);
      return;
    }
    loading = true;
    refreshBtn.disabled = true;
    refreshBtn.classList.add("loading");
    $("refresh-label").textContent = "Refreshing…";
    if (!sheetLoaded) setSheetMsg("Loading…");
    try {
      const data = await fetchRows(passcode);
      if (data && data.error === "denied") { lock("Passcode not accepted. Enter it again."); return; }
      if (!data || !Array.isArray(data.rows)) throw new Error("Unexpected response");
      renderRows(data.rows);
    } catch (err) {
      if (!sheetLoaded) tableWrap.hidden = true;
      setSheetMsg("Couldn't load the sheet. Check the script URL, and make sure you redeployed after updating the script.", true);
    } finally {
      loading = false;
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("loading");
      $("refresh-label").textContent = "Refresh";
    }
  }
  refreshBtn.addEventListener("click", loadSheet);

  /* ---------- Lock screen ---------- */
  function lock(msg) {
    passcode = "";
    try { localStorage.removeItem("passcode"); } catch (e) {}
    sheetBody.textContent = "";
    tableWrap.hidden = true;
    sheetLoaded = false;
    setSheetMsg("Loading…");
    sheetMeta.textContent = "Newest entries first.";
    showView("entry");
    lockEl.hidden = false;
    $("passcode").value = "";
    $("lock-err").textContent = msg || "";
    $("passcode").focus();
  }
  $("lock-btn").addEventListener("click", () => lock(""));

  $("lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = $("lock-err");
    const btn = $("unlock");
    if (urlMissing()) { errEl.textContent = "Add your Apps Script URL in the SCRIPT_URL line first."; return; }
    const typed = $("passcode").value;
    btn.disabled = true;
    btn.classList.add("loading");
    $("unlock-label").textContent = "Checking…";
    errEl.textContent = "";
    try {
      const data = await fetchRows(typed);
      if (data && data.error === "denied") { errEl.textContent = "Wrong passcode."; return; }
      if (!data || !Array.isArray(data.rows)) throw new Error("Unexpected response");
      passcode = typed;
      try { localStorage.setItem("passcode", typed); } catch (e2) {}
      renderRows(data.rows);
      lockEl.hidden = true;
      $("passcode").value = "";
    } catch (err) {
      errEl.textContent = "Couldn't check the passcode. Check the script URL and that you redeployed.";
    } finally {
      btn.disabled = false;
      btn.classList.remove("loading");
      $("unlock-label").textContent = "Unlock";
    }
  });

  // Returning visitor: quietly confirm the saved passcode still works
  if (passcode) loadSheet();
</script>
</body>
</html>
