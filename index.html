<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily work log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Apply saved or system theme before paint to avoid a flash
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --field: #f5f6fa;
    --ink: #151826;
    --muted: #6b7185;
    --line: #e1e4ee;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-ink: #ffffff;
    --ok: #12805c;
    --err: #c2391f;
    --shadow: 0 1px 2px rgba(20,24,50,.06), 0 12px 32px rgba(20,24,50,.08);
  }
  :root[data-theme="dark"] {
    --bg: #0d1017;
    --card: #151a24;
    --field: #0d1017;
    --ink: #eceef6;
    --muted: #8d95ab;
    --line: #262d3c;
    --accent: #8c9cff;
    --accent-hover: #a6b3ff;
    --accent-ink: #0d1017;
    --ok: #4fd1a1;
    --err: #ff8f78;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 72px 16px 32px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    transition: background .25s ease, color .25s ease;
  }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 50%;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: background .25s ease, border-color .25s ease, transform .15s ease;
  }
  .theme-toggle:hover { transform: scale(1.06); }
  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .moon { display: none; }
  :root[data-theme="light"] .theme-toggle .sun { display: none; }
  :root[data-theme="light"] .theme-toggle .moon { display: block; }

  /* Card */
  main {
    width: 100%;
    max-width: 580px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: var(--shadow);
    transition: background .25s ease, border-color .25s ease;
  }
  h1 { margin: 0 0 6px; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin: 0 0 28px; color: var(--muted); }

  .field { margin-bottom: 22px; }
  label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 600; }
  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    transition: border-color .15s ease, box-shadow .15s ease, background .25s ease;
  }
  input[type="date"] { min-height: 46px; }
  textarea { min-height: 200px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  input:disabled, textarea:disabled { opacity: .7; }

  /* Button */
  .save {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 12px;
    padding: 14px 22px;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .save:hover:not(:disabled) { background: var(--accent-hover); }
  .save:active:not(:disabled) { transform: scale(.99); }
  .save:disabled { opacity: .75; cursor: wait; }
  .save:focus-visible, .theme-toggle:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }
  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2.5px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .save.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status { min-height: 1.5em; margin: 16px 0 0; text-align: center; font-weight: 500; font-size: .95rem; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  @media (max-width: 480px) {
    main { padding: 28px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .spinner { animation-duration: 1.5s; }
  }
</style>
</head>
<body>

<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Toggle theme">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<main>
  <h1>Daily work log</h1>
  <p class="sub">Add today's entry to your sheet.</p>

  <form id="log-form">
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>
    </div>
    <div class="field">
      <label for="work">Work done</label>
      <textarea id="work" name="work" required placeholder="What did you work on today?"></textarea>
    </div>
    <button type="submit" class="save" id="save">
      <span class="spinner" aria-hidden="true"></span>
      <span id="save-label">Save entry</span>
    </button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
  // Paste your Apps Script Web app URL here (ends with /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP0WQoWg2lO0FxJ0uF4Uuc6BDNS6mnG8NzDaIAQxXsfMw3m7YuFlj2VdR7zNQeWeJw/exec";

  const root = document.documentElement;
  const toggle = document.getElementById("theme-toggle");
  const form = document.getElementById("log-form");
  const dateInput = document.getElementById("date");
  const workInput = document.getElementById("work");
  const saveBtn = document.getElementById("save");
  const saveLabel = document.getElementById("save-label");
  const statusEl = document.getElementById("status");

  /* ---- Theme toggle ---- */
  function syncToggleLabel() {
    const isDark = root.getAttribute("data-theme") === "dark";
    toggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
  }
  syncToggleLabel();
  toggle.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    syncToggleLabel();
  });

  /* ---- Date defaults to today (local time) ---- */
  function today() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  dateInput.value = today();

  function show(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || "";
  }

  function setLoading(on) {
    saveBtn.disabled = on;
    saveBtn.classList.toggle("loading", on);
    workInput.disabled = on;
    dateInput.disabled = on;
    saveLabel.textContent = on ? "Saving…" : "Save entry";
  }

  /* ---- Submit ---- */
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (SCRIPT_URL.startsWith("PASTE")) {
      show("Add your Apps Script URL in the SCRIPT_URL line first.", "err");
      return;
    }
    setLoading(true);
    show("");
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Apps Script sends no CORS headers; the write still goes through
        body: new URLSearchParams({ date: dateInput.value, work: workInput.value.trim() })
      });
      workInput.value = "";
      dateInput.value = today();
      show("Saved to your sheet.", "ok");
    } catch (err) {
      show("Couldn't save. Check your connection and the script URL.", "err");
    } finally {
      setLoading(false);
      if (statusEl.classList.contains("ok")) workInput.focus();
    }
  });
</script>
</body>
</html>
